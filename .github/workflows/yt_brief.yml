name: Update AIVOS YouTube Brief

on:
  schedule:
    # Run daily at 05:00 UTC (07:00 CEST)
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Run YT Brain Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/yt_brain_pipeline.py

      - name: Commit and Push Updated Briefs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/briefs/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(brief): update daily YouTube brief"
            git push
          fi
